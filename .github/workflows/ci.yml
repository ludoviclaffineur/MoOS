name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    # Build Linux uniquement, via l'image Ubuntu 24.04 du Dockerfile :
    # son étape "test" compile puis lance toute la suite (unitaires + intégration),
    # et l'image finale n'est produite que si elle passe.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construire et tester (Ubuntu 24.04)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: moos:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
